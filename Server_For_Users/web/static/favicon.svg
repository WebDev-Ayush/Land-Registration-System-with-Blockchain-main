<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Fire Orb Gradient -->
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="30%" style="stop-color:#ffbf48;stop-opacity:1" /> <!-- color-one -->
      <stop offset="70%" style="stop-color:#be4a1d;stop-opacity:1" /> <!-- color-two -->
    </linearGradient>

    <!-- Glow/Shadow Effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glow -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#bf4a1d80" stroke-width="2" filter="url(#glow)" opacity="0.6" />

  <!-- Main Orb -->
  <circle cx="50" cy="50" r="40" fill="url(#orbGrad)" />

  <!-- Internal Liquid/Fire Details (Simplified Polygons from mask) -->
  <g fill="#ffffff" opacity="0.4">
    <polygon points="40,40 60,40 50,60" transform="rotate(15 50 50)" />
    <polygon points="45,35 65,65 35,65" transform="rotate(-20 50 50)" />
  </g>

  <!-- Top Shine -->
  <ellipse cx="50" cy="30" rx="20" ry="10" fill="#ffffff" opacity="0.2" />
</svg>
